            { artist: "The Beatnuts", title: "A Musical Massacre", mics: 4, year: 1999 },
            { artist: "Ol' Dirty Bastard", title: "Nigga Please", mics: 4, year: 1999 },
            { artist: "Pharoahe Monch", title: "Internal Affairs", mics: 4, year: 1999 },
            { artist: "Kurupt", title: "Tha Streetz Iz a Mutha", mics: 4, year: 1999 },
            { artist: "Sticky Fingaz", title: "Black Trash: The Autobiography of Kirk Jones", mics: 4, year: 2001 },
            { artist: "Tha Alkaholiks", title: "X.O. Experience", mics: 4, year: 2001 },
            { artist: "Trick Daddy", title: "Thugs Are Us", mics: 4, year: 2001 },
            { artist: "2Pac", title: "Until the End of Time", mics: 4, year: 2001 },
            { artist: "Redman", title: "Malpractice", mics: 4, year: 2001 },
            { artist: "Beanie Sigel", title: "The Reason", mics: 4, year: 2001 },
            { artist: "P. Diddy & The Bad Boy Family", title: "The Saga Continues...", mics: 4, year: 2001 },
            { artist: "Kurupt", title: "Space Boogie: Smoke Oddessey", mics: 4, year: 2001 },
            { artist: "Foxy Brown", title: "Broken Silence", mics: 4, year: 2001 },
            { artist: "Jadakiss", title: "Kiss tha Game Goodbye", mics: 4, year: 2001 },

            // 3.5 Mics (Controversial ratings)
            { artist: "Common", title: "Resurrection", mics: 3.5, year: 1994 },
            { artist: "Souls of Mischief", title: "93 'til Infinity", mics: 3.5, year: 1993 },
            { artist: "Bone Thugs-n-Harmony", title: "E. 1999 Eternal", mics: 3.5, year: 1995 },
            { artist: "The Beatnuts", title: "The Beatnuts: Street Level", mics: 3.5, year: 1994 },

            // 3 Mics (Solid, but some generated debate)
            { artist: "Camp Lo", title: "Uptown Saturday Night", mics: 3, year: 1997 },
            { artist: "Hieroglyphics", title: "3rd Eye Vision", mics: 3, year: 1998 },
            { artist: "Smif-N-Wessun", title: "Dah Shinin'", mics: 3, year: 1995 },

            // 2.5 Mics (Often considered harshly reviewed)
            { artist: "Brotha Lynch Hung", title: "Season of da Siccness", mics: 2.5, year: 1995 },
            { artist: "Lootpack", title: "Soundpieces: Da Antidote", mics: 2.5, year: 1999 },
            { artist: "Del the Funky Homosapien", title: "Both Sides of the Brain", mics: 2.5, year: 2000 },

            // 2 Mics (Needs Help)
            { artist: "Eminem", title: "The Slim Shady LP", mics: 2, year: 1999 }, // Infamous initial rating
            { artist: "Vanilla Ice", title: "To The Extreme", mics: 2, year: 1990 }, // Commonly cited as lower tier

            // 1 Mic (Totally Wack)
            { artist: "MC Hammer", title: "Too Legit to Quit", mics: 1, year: 1991 } // Widely considered lower tier by the publication at the time
        ];

        // Sort albums alphabetically by Artist, then by Album Title
        albums.sort((a, b) => {
            if (a.artist.toLowerCase() < b.artist.toLowerCase()) return -1;
            if (a.artist.toLowerCase() > b.artist.toLowerCase()) return 1;
            
            // If artists are the same, sort by album title
            if (a.title.toLowerCase() < b.title.toLowerCase()) return -1;
            if (a.title.toLowerCase() > b.title.toLowerCase()) return 1;
            return 0;
        });

        const gridContainer = document.getElementById('albumGrid');
        const noResultsMsg = document.getElementById('noResults');

        // Function to generate the HTML for mic icons based on rating
        function renderMics(rating) {
            const maxMics = 5;
            let micsHTML = '';
            // Basic SVG for a microphone (simplified)
            const micIconFull = `<svg class="w-5 h-5 text-yellow-500 fill-current inline-block mr-1" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;
            const micIconHalf = `<svg class="w-5 h-5 text-yellow-500 fill-current inline-block mr-1" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z" fill-opacity="0.5"/></svg>`; // Faked half opacity for illustration
            const micIconEmpty = `<svg class="w-5 h-5 text-gray-300 fill-current inline-block mr-1" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>`;

            for (let i = 1; i <= maxMics; i++) {
                if (rating >= i) {
                    micsHTML += micIconFull;
                } else if (rating === i - 0.5) {
                    // For half mics (like 4.5)
                    micsHTML += micIconHalf;
                } else {
                    micsHTML += micIconEmpty;
                }
            }
            return micsHTML;
        }

        function displayAlbums(albumsToDisplay) {
            gridContainer.innerHTML = '';
            
            if (albumsToDisplay.length === 0) {
                noResultsMsg.classList.remove('hidden');
            } else {
                noResultsMsg.classList.add('hidden');
                
                albumsToDisplay.forEach(album => {
                    const card = document.createElement('div');
                    card.className = 'bg-white dark:bg-gray-800 rounded-xl overflow-hidden shadow-sm hover:shadow-xl transition-all duration-300 border border-gray-100 dark:border-gray-700 flex flex-col h-full transform hover:-translate-y-1';
                    
                    // Assign a color bar based on rating
                    let ratingColor = 'bg-gray-500';
                    if (album.mics === 5) ratingColor = 'bg-yellow-500';
                    else if (album.mics === 4.5) ratingColor = 'bg-orange-500';
                    else if (album.mics === 4) ratingColor = 'bg-blue-500';
                    else if (album.mics === 3.5) ratingColor = 'bg-teal-500';
                    else if (album.mics === 3) ratingColor = 'bg-green-500';
                    else if (album.mics === 2.5) ratingColor = 'bg-red-400';
                    else if (album.mics === 2) ratingColor = 'bg-red-600';
                    else if (album.mics <= 1) ratingColor = 'bg-black dark:bg-gray-400';

                    card.innerHTML = `
                        <div class="h-2 w-full ${ratingColor}"></div>
                        <div class="p-6 flex-grow flex flex-col">
                            <h3 class="text-xl font-bold text-gray-900 dark:text-gray-100 mb-1 leading-tight">${album.title}</h3>
                            <h4 class="text-md text-gray-600 dark:text-gray-400 mb-4">${album.artist}</h4>
                            
                            <div class="mt-auto">
                                <div class="flex items-center justify-between mb-2">
                                    <span class="text-sm font-semibold text-gray-500 dark:text-gray-400">Rating</span>
                                    <span class="text-sm font-bold text-gray-900 dark:text-gray-100 bg-gray-100 dark:bg-gray-700 px-2 py-1 rounded-full">${album.mics} Mics</span>
                                </div>
                                <div class="flex items-center" title="${album.mics} Mics">
                                    ${renderMics(album.mics)}
                                </div>
                                <div class="text-xs text-gray-400 dark:text-gray-500 mt-4 text-right">Released: ${album.year}</div>
                            </div>
                        </div>
                    `;
                    gridContainer.appendChild(card);
                });
            }
        }

        // Filter and Search Logic
        const inputArtist = document.getElementById('searchArtist');
        const inputAlbum = document.getElementById('searchAlbum');
        const selectMic = document.getElementById('filterMic');

        function filterData() {
            const artistQuery = inputArtist.value.toLowerCase();
            const albumQuery = inputAlbum.value.toLowerCase();
            const micFilter = selectMic.value;

            const filtered = albums.filter(album => {
                const matchesArtist = album.artist.toLowerCase().includes(artistQuery);
                const matchesAlbum = album.title.toLowerCase().includes(albumQuery);
                const matchesMic = micFilter === 'all' || album.mics.toString() === micFilter;

                return matchesArtist && matchesAlbum && matchesMic;
            });

            displayAlbums(filtered);
        }

        // Add event listeners
        inputArtist.addEventListener('input', filterData);
        inputAlbum.addEventListener('input', filterData);
        selectMic.addEventListener('change', filterData);

        // Dark Mode Toggle Logic
        const themeToggleBtn = document.getElementById('themeToggle');
        const html = document.documentElement;
        
        // Check for saved user preference, if any, on load of the website
        if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            html.classList.add('dark');
        } else {
            html.classList.remove('dark');
        }

        themeToggleBtn.addEventListener('click', function() {
            // Toggle the dark class on the html element
            html.classList.toggle('dark');
            
            // Save the preference to local storage
            if (html.classList.contains('dark')) {
                localStorage.setItem('color-theme', 'dark');
            } else {
                localStorage.setItem('color-theme', 'light');
            }
        });

        // Initial render
        displayAlbums(albums);

    </script>
</body>
</html>
